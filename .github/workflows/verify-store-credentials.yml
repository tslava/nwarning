name: Verify store credentials

# Run by hand, and worth running before a release: it proves the credentials in
# the `stores` environment still work without submitting anything. A Chrome
# refresh token issued while the OAuth consent screen was in "Testing" expires
# after seven days, and a dead token otherwise announces itself only after a
# release has been tagged and approved.
on:
  workflow_dispatch:
    inputs:
      store:
        description: Which credentials to check
        type: choice
        default: both
        options: [both, chrome, firefox]

permissions: {}

jobs:
  check:
    name: Read from each store
    runs-on: ubuntu-latest
    # The credentials live here, so this needs the same approval a release does.
    # That is the point of keeping them out of the repository's own secrets.
    environment: stores
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          case "${{ inputs.store }}" in
            both) node tools/check-store-credentials.mjs ;;
            *) node tools/check-store-credentials.mjs "${{ inputs.store }}" ;;
          esac
